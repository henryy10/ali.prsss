['34–41','Exercise 2 · Speaking','What makes it unique?','Что делает Каспий уникальным?','7 мин. (34–41). 1 мин. на подготовку, 4 мин. в парах, 2 мин. на ответы класса.','«Выберите два или три факта. Первый ученик говорит один факт, второй добавляет другой. Затем поменяйтесь. Используйте начало предложения с экрана».','Work in pairs. Tell your partner two or three facts.','The Caspian Sea is unique because it is the world’s largest lake. Its water is salty. It is home to the Caspian seal. Another interesting fact is that five countries border it.','Tell me one thing you learned today.'],

const makeClock = seconds => ({duration:seconds,left:seconds*1000,end:null});
const lesson=makeClock(2700), prep=makeClock(60), countdown=makeClock(20);
const secondsLeft = clock => Math.ceil(Math.max(0,clock.end===null ? clock.left : clock.end-performance.now())/1000);
function toggleClock(clock){
  if(clock.end!==null){clock.left=Math.max(0,clock.end-performance.now());clock.end=null;}
  else if(clock.left>0){clock.end=performance.now()+clock.left;}
  updateClocks();
}
function pauseClock(clock){if(clock.end!==null)toggleClock(clock);}
function resetClock(clock){clock.end=null;clock.left=clock.duration*1000;updateClocks();}
function updateClocks(){
  for(const [id,clock,label] of [['lesson',lesson,'Start lesson'],['prep',prep,'Start prep'],['count',countdown,'Start 20s']]){
    const left=secondsLeft(clock);
    if(left===0 && clock.end!==null){
      clock.end=null;clock.left=0;
      if(clock===countdown && round && $('question').open)sfx('countend');
    }
    if(clock===countdown && clock.end!==null && left<=3 && left>0 && left!==clock.last)sfx('tick');
    clock.last=left;
    const display=$(id+'Time'),control=$(id+'Toggle');
    if(display)display.textContent=format(left);
    if(control){
      control.textContent=clock.end!==null?'Pause':left===0?'Time’s up':left<clock.duration?'Resume':label;
      control.disabled=left===0;
    }
  }
}
let video = null;
function youtubeId(value){
  try{
    const url=new URL(value.trim());
    if(!['http:','https:'].includes(url.protocol))return null;
    const host=url.hostname.toLowerCase();
    const id=host==='youtu.be'?url.pathname.split('/')[1]:
      ['youtube.com','www.youtube.com','m.youtube.com'].includes(host)?
      (url.pathname==='/watch'?url.searchParams.get('v'):/^\/(?:shorts|embed|live)\/([^/]+)\/?$/.exec(url.pathname)?.[1]):null;
    return id && /^[a-zA-Z0-9_-]{11}$/.test(id)?id:null;
  }catch{return null;}
}

}

function options(record,chosen,action,reveal=false){
  return '<div class="options '+(record[2].length===4?'two':'')+'">'+record[2].map((label,i)=>{
    const locked=chosen!==null || reveal;
    const cls=locked?(i===record[3]?' good':i===chosen?' bad':''):'';
    return '<button class="option'+cls+'" data-action="'+action+i+'" '+(locked?'disabled':'')+'><b>'+letters[i]+'</b><span>'+label+'</span></button>';
  }).join('')+'</div>';
}
function showQuiz(){
  const item=quiz[quizIndex], chosen=quizAnswers[quizIndex];
  return '<div class="card"><div class="row quiz-nav"><div class="marks">'+quiz.map((_,i)=>'<button data-action="quizGo'+i+'" aria-current="'+(i===quizIndex)+'">'+(i+1)+(quizAnswers[i]!==null?' ✓':'')+'</button>').join('')+'</div><span class="muted">p. 38 · Reading-based · По тексту</span></div><h2 style="margin-top:.45em">'+bi(item[0],item[1])+'</h2>'+
    options(item,chosen,'quizPick')+
    '<div class="feedback" aria-live="polite">'+(chosen===null?'':bi((chosen===item[3]?'Correct. ':'Answer '+letters[item[3]]+'. ')+item[4],item[5]))+'</div>'+
    '<div class="row quiz-nav" style="margin-top:.4em">'+(quizIndex<3?btn('Next question →','quizNext','accent'):btn('Finish exercise →','quizFinish','accent'))+btn('Reset quiz','quizReset')+'</div></div>';
}
function game(){
  let cells=categories.map(pair=>'<div class="category">'+bi(...pair)+'</div>').join('');
  for(let level=0;level<5;level++){
    for(let cat=0;cat<3;cat++){
      const id=cat+'-'+level, used=completed.has(id);
      cells+='<button class="tile" data-tile="'+id+'" aria-label="'+categories[cat][0]+' '+((level+1)*100)+(used?' completed':'')+'" '+(used?'disabled':'')+'>'+(used?'✓ ': '')+((level+1)*100)+'</button>';
    }
  }
  const scores=teams.map((team,i)=>'<div class="team '+(activeTeam===i?'active':'')+'"><input type="text" maxlength="25" data-team-name="'+i+'" aria-label="Team '+(i+1)+' name"><strong id="score'+i+'">'+team.score+'</strong><button data-action="team'+i+'" aria-pressed="'+(activeTeam===i)+'">'+(activeTeam===i?'Turn ✓':'Take turn')+'</button><button data-action="adjust'+i+'" title="Adjust score" aria-label="Adjust score for team '+(i+1)+'">±</button></div>').join('');
  return '<div class="game"><div class="scorebar">'+scores+'</div><div class="board">'+cells+'</div><div class="row game-footer">'+
    btn('Start game ♪','startGame','accent')+btn('Show winner','winner')+btn('Reset tile','resetTile')+btn('Reset game','resetGame')+
    '<span class="muted">'+completed.size+' / 15 played · Choose a tile / Выберите клетку</span></div></div>';
}

    details('Why does the Caspian look like a sea?','Почему Каспий похож на море?','It is very large and its water is salty.','Он очень большой, и вода в нём солёная.'),
    details('Where is the water much deeper?','Где вода намного глубже?','At the southern end.','На юге.'),
    details('What type of fish is the beluga?','К какой группе рыб относится белуга?','It is a sturgeon.','Она относится к осетровым.'),
    details('How does water leave the Caspian?','Как вода уходит из Каспия?','Through evaporation.','Через испарение.')
  ]),
  showQuiz,game,
  ()=>split('<div class="stack">'+card('<strong>What makes the Caspian Sea unique? Tell your partner.</strong>','Что делает Каспийское море уникальным? Расскажите своему партнёру.')+
    '<div class="card tight">'+[
      ['Think about the reading.','Вспомните текст.'],['Work with your partner.','Работайте в паре.'],['Discuss two or three facts.','Обсудите два или три факта.'],['Share your answer with the class.','Поделитесь ответом с классом.']
    ].map(x=>'<p>'+bi(...x)+'</p>').join('')+'</div></div>',
    '<div class="stack"><div class="card quote">'+[
      ['The Caspian Sea is unique because…','Каспийское море уникально, потому что…'],['It is the largest…','Это самое большое…'],['It is home to…','В нём обитают…'],['Another interesting fact is…','Ещё один интересный факт…']
    ].map(x=>'<p>'+bi(...x)+'</p>').join('')+'</div><div class="row quiz-nav"><span class="time" id="prepTime"></span><button data-action="prepToggle" id="prepToggle"></button>'+btn('Reset','prepReset')+'</div></div>'),
  ()=>grid([
    card('One new fact','Один новый факт'),card('One new word','Одно новое слово'),card('One thing you found interesting','Один интересный момент')
  ],3)+'<div class="card" style="margin-top:.65em">'+bi('Choose one card and tell us.','Выберите одну карточку и ответьте устно.')+'</div>',
  ()=>split('<div class="stack">'+card('<strong>Exercise 3, page 38</strong>','Упражнение 3, страница 38.')+
    card('Write 60–80 words about another lake for your school’s English magazine.','Напишите 60–80 слов о другом озере для школьного журнала на английском языке.')+
    card('Start with the name and location. Describe the lake and its wildlife. Finish with an interesting fact.','Начните с названия и расположения. Опишите озеро и его обитателей. Завершите интересным фактом.')+'</div>',
    '<div class="home-headings">'+[
      ['Name','Название'],['Width','Ширина'],['Depth','Глубина'],['Borders','С чем граничит'],['Location','Расположение'],['Waters','Вода'],['Home to','Обитатели'],['Interesting facts','Интересные факты']
    ].map(x=>'<div>'+bi(...x)+'</div>').join('')+'</div>')
];
function render(){
  const [period,label,title,ru]=deck[slide];
  const panel=$('slide');
  panel.innerHTML='<div class="eyebrow">'+(slide===0?'Across the Curriculum 3f · Page 38':label+' · '+period+' min')+'</div><h1>'+title+'</h1><p class="subtitle ru" lang="ru">'+ru+'</p><section class="content">'+content[slide]()+'</section>';
  $('stage').innerHTML='<strong>'+String(slide+1).padStart(2,'0')+'</strong> / '+deck.length+' · '+label+' · '+period+' min';
  $('progress').style.width=((slide+1)/deck.length*100)+'%';
  $('prev').disabled=slide===0;$('next').disabled=slide===deck.length-1;
  if(slide===9)document.querySelectorAll('[data-team-name]').forEach(input=>{input.value=teams[+input.dataset.teamName].name;});
  if(slide===0)showSignal();
  updateClocks();
}
function refreshContent(){
  $('slide').querySelector('.content').innerHTML=content[slide]();
  if(slide===9)document.querySelectorAll('[data-team-name]').forEach(input=>{input.value=teams[+input.dataset.teamName].name;});
  if(slide===0)showSignal();
  updateClocks();
}
function go(offset){
  const target=Math.min(deck.length-1,Math.max(0,slide+offset));
  if(slide===target)return;
  if(slide===0)stopReaction();
  if(slide===10)pauseClock(prep);
  slide=target;render();syncMusic();
}
function dialogTitle(title){return '<div class="dialogtop"><h2>'+title+'</h2>'+btn('×','close','')+'</div>';}
function notes(){
  const [,,title,,timing,script,english,answers,transition]=deck[slide];
  const fields=[
    ['План и время',timing],['Что сказать классу',script],
    ['Фраза на английском',english],['Действия и ответы',answers],
    ['Переход',transition]
  ];
  $('notes').innerHTML=dialogTitle(title)+fields.map(([k,v])=>'<div class="note-item"><b>'+k+'</b>'+v+'</div>').join('')+
    (slide===12?'<p class="note-item small">Источник заданий: Excel 7 for Kazakhstan, Student’s Book, Across the Curriculum 3f, p. 38. Фото животных взяты из изображения страницы, предоставленного учителем.</p>':'');
  $('notes').showModal();
}
function utility(title,html){
  $('utility').innerHTML=dialogTitle(title)+html;
  $('utility').showModal();
}
function settingsVideo(){
  utility('YouTube video','<form id="videoForm" class="stack"><label for="videoInput">'+bi('Paste a YouTube video link','Вставьте ссылку на видео в YouTube')+'</label><div class="row"><input class="input" id="videoInput" type="url" required value="'+(video?'https://www.youtube.com/watch?v='+video:'')+'"><button class="accent">Save</button></div><p class="feedback" id="videoFeedback" role="status"></p></form>');
}
function openTile(id){
  if(completed.has(id))return;
  const [cat,level]=id.split('-').map(Number);
  round={id,cat,level,team:activeTeam,chosen:null,reveal:false,explain:false};
  resetClock(countdown);
  sfx('tile');
  questionView();
  $('question').showModal();
  syncMusic();
}
function questionView(){
  const item=bank[round.cat][round.level];
  const locked=round.chosen!==null || round.reveal;
  $('question').innerHTML='<div class="dialogtop"><div class="eyebrow" style="margin:0">'+categories[round.cat][0]+' · '+((round.level+1)*100)+' <span id="questionTeam"></span></div>'+btn('×','close')+'</div>'+
    '<h2>'+bi(item[0],item[1])+'</h2>'+options(item,round.chosen,'gamePick',round.reveal)+
    '<div class="feedback" aria-live="polite">'+(locked?(round.reveal?bi('Answer '+letters[item[3]]+' · 0 points','Ответ '+letters[item[3]]+' · 0 баллов'):
    round.chosen===item[3]?bi('Correct! +'+((round.level+1)*100),'Верно!'):bi('Answer '+letters[item[3]]+' · 0 points','Ответ '+letters[item[3]]+' · 0 баллов')):'')+'</div>'+
    (round.explain?'<div class="card" style="margin:.35em 0">'+bi(item[4],item[5])+'</div>':'')+
    '<div class="row quiz-nav">'+(locked?btn(round.explain?'Hide explanation':'Show explanation','explain'):'<span class="time" id="countTime"></span><button id="countToggle" data-action="countToggle"></button>'+btn('Reset timer','countReset')+btn('Reveal answer','revealGame'))+btn('Back to board','close','accent')+'</div>';
  $('questionTeam').textContent=' / '+teams[round.team].name;
  updateClocks();
}
function answerGame(choice){
  if(!round || completed.has(round.id))return;
  const record=bank[round.cat][round.level];
  const delta=choice===record[3]?(round.level+1)*100:0;
  winnerShown=false;
  round.chosen=choice;
  round.reveal=choice===null;
  completed.set(round.id,{team:round.team,delta});
  teams[round.team].score+=delta;
  pauseClock(countdown);
  if(!round.reveal)sfx(delta?'correct':'incorrect');
  questionView();
  $('question').querySelector('[data-action=explain]').focus();
}
function closeRound(){
  if(!round)return;
  pauseClock(countdown);
  if(completed.has(round.id))activeTeam=1-round.team;
  round=null;
  if(slide===9)refreshContent();
  syncMusic();
}
function adjust(i){
  utility('Adjust score','<p id="adjustLabel"></p><form id="scoreForm" data-team="'+i+'" class="row" style="margin-top:.6em"><input required class="input" id="scoreValue" type="number" step="1" min="-1000000" max="1000000" aria-label="Points to add or subtract"><button class="accent">Apply points</button></form>');
  $('adjustLabel').textContent=teams[i].name+' · '+teams[i].score+' pts (enter + or − points)';
}
function showWinner(){
  const first=teams[0].score,second=teams[1].score;
  utility('Final Score','<div class="align-center"><h1 class="winner" id="winnerName"></h1><p id="winnerScores" style="margin-top:.55em"></p></div>');
  $('winnerName').textContent=first===second?'It’s a tie!':teams[first>second?0:1].name+' wins!';
  $('winnerScores').textContent=teams[0].name+' '+first+'  ·  '+teams[1].name+' '+second;
  if(!winnerShown){sfx('win');winnerShown=true;}
}
function resetTileDialog(){
  if(!completed.size){utility('Reset tile','<p>'+bi('No completed tile yet.','Сыгранных клеток пока нет.')+'</p>');return;}
  utility('Reset a played tile','<p class="subtitle">'+bi('Reopen a tile and undo the points from it.','Откройте клетку заново и отмените начисленные за неё баллы.')+'</p><div class="row" style="margin-top:.6em">'+Array.from(completed.keys(),id=>{
      const [cat,level]=id.split('-').map(Number);
      return btn(categories[cat][0]+' '+((level+1)*100),'undo'+id);
    }).join('')+'</div>');
}
let audioContext,master,soundOn=false,musicStarted=false,musicHandle=null,musicStep=0;
function turnSound(on){
  if(on){
    const Audio=window.AudioContext || window.webkitAudioContext;
    if(!Audio)return;
    if(!audioContext){
      audioContext=new Audio();
      master=audioContext.createGain();master.gain.value=0;master.connect(audioContext.destination);
    }
    audioContext.resume().catch(()=>{});
  }
  soundOn=on;
  if(master){
    master.gain.cancelScheduledValues(audioContext.currentTime);
    master.gain.setTargetAtTime(on ? .32 : 0,audioContext.currentTime,.025);
  }
  $('soundButton').textContent=on?'Sound on':'Sound off';
  $('soundButton').setAttribute('aria-pressed',String(on));
  syncMusic();
}
function note(midi,at,length,volume=.16,type='sine'){
  if(!soundOn || !audioContext)return;
  const oscillator=audioContext.createOscillator();
  const gain=audioContext.createGain();
  oscillator.frequency.value=440*2**((midi-69)/12);oscillator.type=type;
  gain.gain.setValueAtTime(.001,at);
  gain.gain.exponentialRampToValueAtTime(volume,at+.016);
  gain.gain.exponentialRampToValueAtTime(.001,at+length);
  oscillator.connect(gain);gain.connect(master);
  oscillator.start(at);oscillator.stop(at+length+.015);
  oscillator.onended=()=>{oscillator.disconnect();gain.disconnect();};
}
function sfx(event){
  if(!soundOn || !audioContext)return;
  const motifs={tile:[67,74],correct:[67,71,74,79],incorrect:[64,60,57],tick:[78],countend:[74,67],win:[60,64,67,72,76,79,84]};
  motifs[event].forEach((pitch,i)=>note(pitch,audioContext.currentTime+i*.103,.19,.115,'triangle'));
}
function musicBeat(){
  const melody=[57,64,67,64,60,67,69,67,55,62,65,62,57,64,69,72];
  const now=audioContext.currentTime;
  note(melody[musicStep%melody.length],now,.21,.045,'triangle');
  if(musicStep%4===0)note(melody[musicStep%melody.length]-12,now,.38,.065);
  musicStep+=1;
}
function syncMusic(){
  const play=slide===9 && soundOn && musicStarted && !round && !document.hidden;
  if(play && !musicHandle){musicBeat();musicHandle=setInterval(musicBeat,305);}
  if(!play && musicHandle){clearInterval(musicHandle);musicHandle=null;}
}
async function fullscreen(){
  try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}
  catch{utility('Fullscreen',bi('Use your browser’s fullscreen command.','Включите полноэкранный режим через меню браузера.'));}
}
$('lessonToggle').onclick=()=>toggleClock(lesson);
$('lessonReset').onclick=()=>resetClock(lesson);
$('notesButton').onclick=notes;
$('soundButton').onclick=()=>{if(slide===9 && !soundOn)musicStarted=true;turnSound(!soundOn);};
$('fullButton').onclick=fullscreen;
$('prev').onclick=()=>go(-1);$('next').onclick=()=>go(1);
$('question').addEventListener('close',closeRound);
document.addEventListener('visibilitychange',syncMusic);
document.addEventListener('keydown',event=>{
  if(event.altKey || event.ctrlKey || event.metaKey || event.repeat || event.target.matches('input,textarea,[contenteditable]'))return;
  if(event.key.toLowerCase()==='m'){if(slide===9 && !soundOn)musicStarted=true;turnSound(!soundOn);return;}
  if(document.querySelector('dialog[open]'))return;
  if(event.key==='ArrowRight'){event.preventDefault();go(1);}
  if(event.key==='ArrowLeft'){event.preventDefault();go(-1);}
  if(event.key.toLowerCase()==='f'){event.preventDefault();fullscreen();}
});
document.addEventListener('change',event=>{
  const input=event.target.closest('[data-team-name]');
  if(input){
    const i=+input.dataset.teamName;
    teams[i].name=input.value.trim() || (i?'Team Wave':'Team Ocean');
    input.value=teams[i].name;
  }
});
document.addEventListener('submit',event=>{
  const form=event.target;
  if(form.id==='videoForm'){
    event.preventDefault();
    const id=youtubeId($('videoInput').value);
    if(!id){$('videoFeedback').textContent='Use a full YouTube or youtu.be video link.';return;}
    video=id;$('utility').close();refreshContent();
  }
  if(form.id==='scoreForm'){
    event.preventDefault();
    teams[+form.dataset.team].score+=Number($('scoreValue').value);
    winnerShown=false;$('utility').close();refreshContent();
  }
});
document.addEventListener('click',event=>{
  const target=event.target.closest('button');
  if(!target || target.disabled)return;
  if(target.dataset.map!==undefined){
    const i=+target.dataset.map;
    if(mapOpen.has(i))mapOpen.delete(i);else mapOpen.add(i);
    refreshContent();document.querySelector('[data-map="'+i+'"]').focus();return;
  }
  if(target.dataset.tile){openTile(target.dataset.tile);return;}
  const op=target.dataset.action;
  if(!op)return;
  if(op.startsWith('quizGo')){quizIndex=+op.slice(6);refreshContent();return;}
  if(op.startsWith('quizPick')){
    if(quizAnswers[quizIndex]!==null)return;
    quizAnswers[quizIndex]=+op.slice(8);refreshContent();return;
  }
  if(op.startsWith('gamePick')){answerGame(+op.slice(8));return;}
  if(/^team[01]$/.test(op)){activeTeam=+op.slice(4);refreshContent();return;}
  if(/^adjust[01]$/.test(op)){adjust(+op.slice(6));return;}
  if(op.startsWith('undo')){
    const id=op.slice(4), record=completed.get(id);
    if(record){teams[record.team].score-=record.delta;completed.delete(id);}
    winnerShown=false;$('utility').close();refreshContent();return;
  }
  switch(op){
    case 'close': target.closest('dialog').close();break;
    case 'video': settingsVideo();break;
    case 'reactionNext': nextSignal();break;
    case 'reactionAuto':
      if(reactionLoop)stopReaction();
      else{reactionLoop=setInterval(nextSignal,2200);nextSignal();}
      break;
    case 'mapHide': mapOpen.clear();refreshContent();break;
    case 'quizNext': quizIndex=Math.min(3,quizIndex+1);refreshContent();break;
    case 'quizFinish': go(1);break;
    case 'quizReset': quizIndex=0;quizAnswers.fill(null);refreshContent();break;
    case 'prepToggle': toggleClock(prep);break;
    case 'prepReset': resetClock(prep);break;
    case 'countToggle': toggleClock(countdown);break;
    case 'countReset': resetClock(countdown);break;
    case 'revealGame': answerGame(null);break;
    case 'explain': round.explain=!round.explain;questionView();break;
    case 'startGame': musicStarted=true;turnSound(true);break;
    case 'winner': showWinner();break;
    case 'resetTile': resetTileDialog();break;
    case 'resetGame':
      utility('Reset the game?','<div class="stack"><p>'+bi('Clear both scores and reopen all 15 tiles?','Обнулить счёт обеих команд и открыть все 15 клеток?')+'</p><div class="row">'+btn('Reset game','confirmReset','accent')+btn('Cancel','close')+'</div></div>');
      break;
    case 'confirmReset':
      completed.clear();teams.forEach(team=>{team.score=0;});activeTeam=0;winnerShown=false;
      $('utility').close();refreshContent();break;
  }
});
render();
setInterval(updateClocks,120);
</script>
</body>
</html>
